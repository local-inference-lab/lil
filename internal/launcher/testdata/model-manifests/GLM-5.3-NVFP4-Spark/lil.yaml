schema_version: 1
kind: model
family: glm
description: GLM-5.3 with NVFP4 routed experts, MXFP8 projections, and an NVFP4 MTP expert layer
serving:
  served_model_name: GLM-5.3
  trust_remote_code: true
  async_scheduling: true
  generation_config: vllm
  long_prefill_token_threshold: 2048
kernels:
  quantization: modelopt_mixed
speculators:
  default: mtp
  mtp:
    tokens: 3
    moe_quantization: nvfp4
    attention: B12X
    draft_sample_method: probabilistic
    model: target
compilation:
  cudagraph_mode: FULL_AND_PIECEWISE
  custom_ops:
    - all
environment:
  CUDA_DEVICE_MAX_CONNECTIONS: "32"
